# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(archy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- xdg-terminal-exec
$browser = archy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(archy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, archy-launch-browser
bindd = SUPER, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(archy-cmd-terminal-cwd)"
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, V, VSCode, exec, code
bindd = SUPER ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, N, Editor, exec, archy-launch-editor
bindd = SUPER ALT, T, Activity, exec, archy-launch-tui btop
bindd = SUPER ALT, D, Docker, exec, archy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, archy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password
bindd = SUPER SHIFT, M, Messenger, exec, archy-launch-webapp "https://facebook.com/messages"
bindd = SUPER SHIFT, D, Discord, exec, archy-launch-webapp "https://discord.com/channels/@me"
bindd = SUPER SHIFT, S, Spotify, exec, archy-launch-webapp "https://open.spotify.com"
#
# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, C, ChatGPT, exec, archy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, E, Email, exec, archy-launch-webapp "https://mail.google.com"
bindd = SUPER SHIFT, Y, YouTube, exec, archy-launch-webapp "https://youtube.com/"

unbind = SUPER, H
unbind = SUPER, L
bind = SUPER, h, workspace, -1
bind = SUPER, l, workspace, +1
bind = SUPER CTRL, left, movefocus, l
bind = SUPER CTRL, right, movefocus, r
bind = SUPER CTRL, up, movefocus, u
bind = SUPER CTRL, down, movefocus, d

bindd = SUPER, J, Toggle window split, togglesplit, # dwindle
bindd = SUPER ALT, LEFT, Swap window to the left, swapwindow, l
bindd = SUPER ALT, RIGHT, Swap window to the right, swapwindow, r
bindd = SUPER ALT, UP, Swap window up, swapwindow, u
bindd = SUPER ALT, DOWN, Swap window down, swapwindow, d

bindd = SHIFT CTRL, 4, Screenshot to clipboard, exec, archy-capture-screenshot smart clipboard


bind = SUPER, A, togglespecialworkspace, magic
bind = SUPER ALT, A, movetoworkspace, special:magic
